type: object
required:
  - run_id
  - status
  - resources
  - quality_report
properties:
  run_id:
    type: integer
  status:
    type: string
    enum: [pending, running, completed, failed, cancelled]
  target:
    type: string
  profile:
    type: object
    additionalProperties: true
  agent_trace:
    type: array
    items:
      $ref: ./AgentTraceItem.yaml
  progress_events:
    type: array
    items:
      type: object
      additionalProperties: true
  resources:
    type: array
    items:
      $ref: ./GeneratedLearningResource.yaml
  quality_report:
    $ref: ./AgentQualityReport.yaml
  path_suggestion:
    type: object
    additionalProperties: true
  warnings:
    type: array
    items:
      type: string
