# MEFKT-NG prd 候选清单；CPU 配额修订版
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mefkt-code
  namespace: advisor-rhw
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mefkt-data
  namespace: advisor-rhw
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: juicefs-sc
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mefkt-ng-results
  namespace: advisor-rhw
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: mefkt-ng-20260924-5090-upload
  namespace: advisor-rhw
  labels:
    app.kubernetes.io/name: mefkt-ng-uploader
    mefkt-ng-job: mefkt-ng-20260924-5090
spec:
  nodeSelector:
    node-type: cpu
  restartPolicy: Never
  containers:
    - name: uploader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 7200"]
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 400m
          memory: 1Gi
      volumeMounts:
        - name: code
          mountPath: /workspace
        - name: data
          mountPath: /data
        - name: results
          mountPath: /results
  volumes:
    - name: code
      persistentVolumeClaim:
        claimName: mefkt-code
    - name: data
      persistentVolumeClaim:
        claimName: mefkt-data
    - name: results
      persistentVolumeClaim:
        claimName: mefkt-ng-results
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: mefkt-ng-20260924-5090
  namespace: advisor-rhw
  labels:
    app.kubernetes.io/name: mefkt-ng
    mefkt-ng-run: mefkt-ng-20260924-5090
    mefkt-ng-job: mefkt-ng-20260924-5090
spec:
  schedulerName: volcano
  queue: advisor-rhw-gpu
  priorityClassName: gpu-job-high
  minAvailable: 2
  maxRetry: 2
  plugins:
    svc:
      - --publish-not-ready-addresses=true
  tasks:
    - name: worker
      replicas: 2
      template:
        metadata:
          labels:
            mefkt-ng-job: mefkt-ng-20260924-5090
        spec:
          nodeSelector:
            node-type: gpu
          restartPolicy: OnFailure
          containers:
            - name: trainer
              image: nvcr.io/nvidia/pytorch:26.04-py3
              imagePullPolicy: IfNotPresent
              command: ["bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  until test -f /workspace/jobs/mefkt-ng-20260924-5090/.ready; do sleep 5; done
                  export PYTHONUNBUFFERED=1
                  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
                  export OMP_NUM_THREADS=2
                  export MKL_NUM_THREADS=2
                  export MASTER_ADDR="${VC_WORKER_HOSTS%%,*}"
                  export MASTER_PORT=23456
                  export WORLD_SIZE="${VC_WORKER_NUM}"
                  if [ -n "${VK_TASK_INDEX:-}" ]; then
                    export RANK="${VK_TASK_INDEX}"
                  elif [[ "${HOSTNAME:-}" =~ -worker-([0-9]+)$ ]]; then
                    export RANK="${BASH_REMATCH[1]}"
                  else
                    export RANK=0
                  fi
                  export LOCAL_RANK=0
                  mkdir -p /results/mefkt-ng-runs/mefkt-ng-20260924-5090/logs
                  set +e
                  torchrun --nnodes="${WORLD_SIZE}" --node_rank="${RANK}" --nproc_per_node=1 \
                    --master_addr="${MASTER_ADDR}" --master_port="${MASTER_PORT}" \
                    /workspace/jobs/mefkt-ng-20260924-5090/mefkt_ng_train.py \
                    --events-file /data/mefkt-ng-inputs/mefkt-ng-20260924-5090/train.csv --content-embeddings-file /data/mefkt-ng-inputs/mefkt-ng-20260924-5090/item_content_embeddings.npz  \
                    --data-root /results/mefkt-ng-prepared/mefkt-ng-20260924-5090 --output-dir /results/mefkt-ng-runs/mefkt-ng-20260924-5090 \
                    --epochs 200 --batch-size 128 --sequence-length 200 \
                    --context-length 64 --hidden-dim 1024 \
                    --learning-rate 0.0001 --num-workers 0 --device cuda --amp  \
                    2>&1 | tee -a /results/mefkt-ng-runs/mefkt-ng-20260924-5090/logs/rank-${RANK}.log
                  status=${PIPESTATUS[0]}
                  set -e
                  exit "$status"
              resources:
                requests:
                  cpu: "1"
                  memory: 16Gi
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "4"
                  memory: 64Gi
                  nvidia.com/gpu: "1"
              ports:
                - name: torchrun
                  containerPort: 23456
              volumeMounts:
                - name: code
                  mountPath: /workspace
                - name: data
                  mountPath: /data
                - name: results
                  mountPath: /results
                - name: shm
                  mountPath: /dev/shm
          volumes:
            - name: code
              persistentVolumeClaim:
                claimName: mefkt-code
            - name: data
              persistentVolumeClaim:
                claimName: mefkt-data
            - name: results
              persistentVolumeClaim:
                claimName: mefkt-ng-results
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
